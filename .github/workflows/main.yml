name: 🚀 Deploy to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy FastAPI Docker to Azure VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH & Deploy to Azure VM
        env:
          SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          HOST: ${{ secrets.AZURE_VM_HOST }}
          USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          HOST=$(echo "$HOST" | xargs)
          USER=$(echo "$USER" | xargs)

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/id_rsa ${USER}@${HOST} << 'EOF'
            set -e
            cd /home/azureuser/emotion-backend
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
          EOF



