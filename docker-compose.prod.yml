version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emotion_detection_backend
    restart: always
    ports:
      - "2508:2508"
    env_file:
      - .env
    environment:
      - PORT=2508
      - ENV=production
      - DEBUG=False
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./logs:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 2508 --workers 2

volumes:
  hf_cache:
