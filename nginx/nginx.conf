# Cấu hình Nginx cho Face Emotion Detection Backend
# Đường dẫn cài đặt trên Ubuntu: /etc/nginx/sites-available/emotion_backend
# Sau đó symlink sang: /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name emdbe.ducbkdn.space 74.226.217.46; # Thay bằng domain của bạn nếu có

    client_max_body_size 50M;

    # API endpoints & Docs
    location / {
        proxy_pass http://127.0.0.1:2508;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cấu hình WebSocket cho Socket.IO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:2508/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
